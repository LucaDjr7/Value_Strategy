[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "value-strategy"
version = "1.0.0"
description = "Stratégie long/short equity value (B/M ajusté intangibles) + qualité + momentum + détection ML de régimes junk rally"
readme = "README.md"
requires-python = ">=3.9"
authors = [{ name = "Luca Desjardin" }]
license = { text = "MIT" }
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "scipy>=1.10",
    "scikit-learn>=1.3",
    "matplotlib>=3.7",
    "requests>=2.28",
    "pyarrow>=12.0",
]

[project.optional-dependencies]
wrds = ["wrds>=3.1"]
ml = ["hmmlearn>=0.3", "xgboost>=1.7"]
macro = ["pandas-datareader>=0.10", "fredapi>=0.5"]
dev = ["pytest>=7.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
